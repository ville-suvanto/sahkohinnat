<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sähköhinnat">
<meta name="theme-color" content="#0f1117">
<title>Sähköhinnat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface2: #1e2130;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f0;
    --muted: #6b7280;
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --amber: #fbbf24;
    --amber-dim: rgba(251,191,36,0.1);
    --accent: #818cf8;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  body { padding-bottom: env(safe-area-inset-bottom, 20px); }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--accent); }

  #refresh-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: color 0.2s;
  }
  #refresh-btn:active { transform: scale(0.94); }
  #refresh-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 14px 20px 0;
  }

  .tab {
    flex: 1;
    padding: 9px 0;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--surface2);
    color: var(--text);
    border-color: rgba(255,255,255,0.15);
  }
  .tab:active { transform: scale(0.97); }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px 20px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
  }
  .stat-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  .chart-wrap {
    padding: 0 20px 6px;
    position: relative;
    height: 160px;
  }
  canvas { display: block; }

  .legend {
    display: flex;
    gap: 14px;
    padding: 0 20px 14px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
    display: inline-block;
    margin-right: 5px;
    vertical-align: middle;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 20px 10px;
  }

  .hour-list { padding: 0 20px; }

  .hour-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-row.current {
    background: var(--surface);
    margin: 0 -12px;
    padding: 10px 12px;
    border-radius: 10px;
    border-bottom: none;
  }

  .hour-time {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    min-width: 95px;
  }
  .hour-price {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }
  .hour-bar {
    height: 4px;
    border-radius: 2px;
    width: 60px;
    background: var(--surface2);
    overflow: hidden;
  }
  .hour-bar-fill { height: 100%; border-radius: 2px; }

  .badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .badge-cheap { background: var(--green-dim); color: var(--green); }
  .badge-now { background: var(--amber-dim); color: var(--amber); }
  .badge-exp { background: var(--red-dim); color: var(--red); }

  .status-bar {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 14px 20px 20px;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  #error-msg {
    display: none;
    margin: 0 20px 14px;
    padding: 12px 16px;
    background: var(--red-dim);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: 10px;
    color: var(--red);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Sähkö<span>hinnat</span></div>
  <button id="refresh-btn" onclick="fetchPrices()" title="Päivitä">↻</button>
</header>

<div class="tabs">
  <button class="tab active" id="tab-today" onclick="showDay('today')">Tänään</button>
  <button class="tab" id="tab-tomorrow" onclick="showDay('tomorrow')">Huomenna</button>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Keskihinta</div>
    <div class="stat-value" id="stat-avg">—</div>
    <div class="stat-sub" id="stat-avg-sub">snt/kWh</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Halvin tunti</div>
    <div class="stat-value" id="stat-min">—</div>
    <div class="stat-sub" id="stat-min-sub"></div>
  </div>
</div>

<div id="error-msg"></div>

<div class="chart-wrap">
  <canvas id="priceChart" role="img" aria-label="Sähkön tuntihintakaavio"></canvas>
</div>

<div class="legend">
  <span><span class="legend-dot" style="background:#4ade80"></span>Halpa</span>
  <span><span class="legend-dot" style="background:#6b7280"></span>Normaali</span>
  <span><span class="legend-dot" style="background:#f87171"></span>Kallis</span>
</div>

<div class="section-title">Tunnit</div>
<div class="hour-list" id="hour-list"></div>
<div class="status-bar" id="status-bar">Haetaan hintatietoja...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let allData = { today: [], tomorrow: [] };
let currentDay = 'today';
let chartInstance = null;

function dateToApiUrl(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `https://www.sahkonhintatanaan.fi/api/v1/prices/${y}/${m}-${day}.json`;
}

async function fetchPrices() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('status-bar').textContent = 'Haetaan hintatietoja...';

  try {
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);

    const [resToday, resTomorrow] = await Promise.allSettled([
      fetch(dateToApiUrl(now)),
      fetch(dateToApiUrl(tomorrow))
    ]);

    if (resToday.status === 'rejected' || !resToday.value.ok) throw new Error('Verkkovirhe');
    const todayData = await resToday.value.json();

    allData.today = todayData
      .map(p => ({ hour: new Date(p.DateTime).getHours(), price: p.PriceWithTax / 100 }))
      .sort((a, b) => a.hour - b.hour);

    if (resTomorrow.status === 'fulfilled' && resTomorrow.value.ok) {
      const tomorrowData = await resTomorrow.value.json();
      allData.tomorrow = tomorrowData
        .map(p => ({ hour: new Date(p.DateTime).getHours(), price: p.PriceWithTax / 100 }))
        .sort((a, b) => a.hour - b.hour);
    } else {
      allData.tomorrow = [];
    }

    if (allData.today.length === 0) throw new Error('Ei hintatietoja saatavilla');

    document.getElementById('tab-tomorrow').textContent =
      allData.tomorrow.length > 0 ? 'Huomenna' : 'Huomenna (—)';

    const time = now.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('status-bar').textContent = 'Päivitetty ' + time;
    renderDay(currentDay);

  } catch(e) {
    const err = document.getElementById('error-msg');
    err.style.display = 'block';
    err.textContent = 'Hintatietojen haku epäonnistui. Tarkista verkkoyhteytesi.';
    document.getElementById('status-bar').textContent = '';
  } finally {
    btn.classList.remove('spinning');
  }
}

function renderDay(day) {
  const prices = allData[day];

  if (!prices || prices.length === 0) {
    document.getElementById('hour-list').innerHTML = '<div class="empty-state">Hintatietoja ei vielä saatavilla.</div>';
    document.getElementById('stat-avg').textContent = '—';
    document.getElementById('stat-min').textContent = '—';
    document.getElementById('stat-min-sub').textContent = '';
    renderChart([]);
    return;
  }

  const vals = prices.map(p => p.price);
  const avg = vals.reduce((a,b) => a+b, 0) / vals.length;
  const minVal = Math.min(...vals);
  const maxVal = Math.max(...vals);
  const minEntry = prices.find(p => p.price === minVal);
  const cheapThreshold = avg * 0.8;
  const expThreshold = avg * 1.2;

  document.getElementById('stat-avg').textContent = (avg * 100).toFixed(1);
  document.getElementById('stat-avg-sub').textContent = 'snt/kWh';
  document.getElementById('stat-min').textContent = pad(minEntry.hour) + ':00';
  document.getElementById('stat-min-sub').textContent = (minVal * 100).toFixed(1) + ' snt/kWh';

  renderChart(prices, avg, cheapThreshold, expThreshold);

  const now = new Date();
  const curHour = now.getHours();
  let html = '';

  for (const p of prices) {
    const isCheap = p.price <= cheapThreshold;
    const isExp = p.price >= expThreshold;
    const isCurrent = day === 'today' && p.hour === curHour;
    const pct = maxVal > 0 ? Math.round((p.price / maxVal) * 100) : 0;
    const barColor = isCheap ? '#4ade80' : isExp ? '#f87171' : '#6b7280';

    const badges = [];
    if (isCurrent) badges.push('<span class="badge badge-now">Nyt</span>');
    else if (isCheap) badges.push('<span class="badge badge-cheap">Halpa</span>');
    else if (isExp) badges.push('<span class="badge badge-exp">Kallis</span>');

    html += `<div class="hour-row${isCurrent ? ' current' : ''}">
      <span class="hour-time">${pad(p.hour)}–${pad(p.hour+1 < 24 ? p.hour+1 : 0)}</span>
      <span class="hour-price">${(p.price * 100).toFixed(1)} snt</span>
      <div class="hour-bar"><div class="hour-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      ${badges.join('')}
    </div>`;
  }

  document.getElementById('hour-list').innerHTML = html;

  if (day === 'today') {
    setTimeout(() => {
      const rows = document.querySelectorAll('.hour-row.current');
      if (rows.length) rows[0].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
  }
}

function renderChart(prices, avg, cheapT, expT) {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  if (!prices.length) return;

  const bgColors = prices.map(p => {
    if (cheapT !== undefined && p.price <= cheapT) return '#4ade80';
    if (expT !== undefined && p.price >= expT) return '#f87171';
    return '#4b5563';
  });

  chartInstance = new Chart(document.getElementById('priceChart'), {
    type: 'bar',
    data: {
      labels: prices.map(p => pad(p.hour)),
      datasets: [{
        data: prices.map(p => parseFloat((p.price * 100).toFixed(2))),
        backgroundColor: bgColors,
        borderRadius: 3,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e2130',
          titleColor: '#9ca3af',
          bodyColor: '#f0f0f0',
          borderColor: 'rgba(255,255,255,0.08)',
          borderWidth: 1,
          callbacks: { label: ctx => ctx.parsed.y.toFixed(1) + ' snt/kWh' }
        }
      },
      scales: {
        x: {
          ticks: { color: '#4b5563', font: { size: 10, family: 'DM Mono' }, autoSkip: true, maxTicksLimit: 12 },
          grid: { display: false },
          border: { display: false }
        },
        y: {
          ticks: { color: '#4b5563', font: { size: 10, family: 'DM Mono' }, callback: v => v.toFixed(0) },
          grid: { color: 'rgba(255,255,255,0.04)' },
          border: { display: false }
        }
      }
    }
  });
}

function showDay(day) {
  currentDay = day;
  document.getElementById('tab-today').classList.toggle('active', day === 'today');
  document.getElementById('tab-tomorrow').classList.toggle('active', day === 'tomorrow');
  renderDay(day);
}

function pad(n) { return String(n).padStart(2,'0'); }

fetchPrices();
setInterval(fetchPrices, 10 * 60 * 1000);
</script>
</body>
</html>
