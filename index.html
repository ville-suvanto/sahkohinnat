<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sähköhinnat">
<meta name="theme-color" content="#0f1117">
<title>Sähköhinnat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181b24;--surface2:#1e2130;--border:rgba(255,255,255,0.07);
  --text:#f0f0f0;--muted:#6b7280;--green:#4ade80;--green-dim:rgba(74,222,128,0.12);
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);--amber:#fbbf24;--amber-dim:rgba(251,191,36,0.1);--accent:#818cf8;
}
html,body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overscroll-behavior:none}
body{padding-bottom:env(safe-area-inset-bottom,20px)}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.logo span{color:var(--accent)}
.header-right{display:flex;gap:8px;align-items:center}
#notif-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);height:36px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-family:'Syne',sans-serif;white-space:nowrap}
#notif-btn.on{border-color:rgba(129,140,248,0.4);color:var(--accent)}
#refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
#refresh-btn:active{transform:scale(0.94)}
@keyframes spin{to{transform:rotate(360deg)}}
#refresh-btn.spinning{animation:spin 0.8s linear infinite}
.tabs{display:flex;gap:6px;padding:14px 20px 0}
.tab{flex:1;padding:9px 0;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:10px;cursor:pointer}
.tab.active{background:var(--surface2);color:var(--text);border-color:rgba(255,255,255,0.15)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.stat-value{font-family:'DM Mono',monospace;font-size:20px;font-weight:500}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}
.contract-line{margin:0 20px 14px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.contract-line span{font-family:'DM Mono',monospace;color:var(--accent);font-size:13px;font-weight:500}
.notif-banner{display:none;margin:0 20px 14px;padding:12px 14px;background:rgba(129,140,248,0.1);border:1px solid rgba(129,140,248,0.25);border-radius:10px;font-size:13px;color:var(--accent)}
.notif-banner button{margin-top:8px;padding:7px 14px;background:var(--accent);color:#0f1117;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;width:100%}
.chart-wrap{padding:0 20px 6px;position:relative;height:160px}
canvas{display:block}
.legend{display:flex;gap:14px;padding:0 20px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
.section-title{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:0 20px 10px}
.hour-list{padding:0 20px}
.hour-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;margin-bottom:3px;font-size:14px}
.hour-row.cheap{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.18)}
.hour-row.expensive{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.18)}
.hour-row.current{outline:2px solid var(--amber);outline-offset:-1px}
.hour-time{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);min-width:90px}
.hour-price{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;flex:1}
.hour-price.green{color:var(--green)}
.hour-price.red{color:var(--red)}
.hour-diff{font-family:'DM Mono',monospace;font-size:11px;min-width:56px;text-align:right}
.hour-diff.pos{color:var(--red)}
.hour-diff.neg{color:var(--green)}
.badge{font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.badge-now{background:var(--amber-dim);color:var(--amber)}
.status-bar{text-align:center;font-size:12px;color:var(--muted);padding:14px 20px 20px}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
#error-msg{display:none;margin:0 20px 14px;padding:12px 16px;background:var(--red-dim);border:1px solid rgba(248,113,113,0.2);border-radius:10px;color:var(--red);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">Sähkö<span>hinnat</span></div>
  <div class="header-right">
    <button id="notif-btn" onclick="toggleNotifications()">🔔 Ilmoitukset</button>
    <button id="refresh-btn" onclick="fetchPrices()" title="Päivitä">↻</button>
  </div>
</header>
<div class="notif-banner" id="notif-banner">
  Saat joka aamu klo 7 ilmoituksen päivän halvimmista sähkötunneista — vaikka sovellus olisi kiinni.
  <button onclick="requestNotifPermission()">Salli ilmoitukset</button>
</div>
<div class="tabs">
  <button class="tab active" id="tab-today" onclick="showDay('today')">Tänään</button>
  <button class="tab" id="tab-tomorrow" onclick="showDay('tomorrow')">Huomenna</button>
</div>
<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Keskihinta tänään</div>
    <div class="stat-value" id="stat-avg">—</div>
    <div class="stat-sub" id="stat-avg-sub">snt/kWh</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Halvin tunti</div>
    <div class="stat-value" id="stat-min">—</div>
    <div class="stat-sub" id="stat-min-sub"></div>
  </div>
</div>
<div class="contract-line">
  Sopimushintasi (Oomi Jousto) <span>7,79 snt/kWh</span>
</div>
<div id="error-msg"></div>
<div class="chart-wrap"><canvas id="priceChart"></canvas></div>
<div class="legend">
  <span><span class="legend-dot" style="background:#4ade80"></span>Alle 7,79 → säästät</span>
  <span><span class="legend-dot" style="background:#f87171"></span>Yli 7,79 → kalliimpaa</span>
</div>
<div class="section-title">Tunnit</div>
<div class="hour-list" id="hour-list"></div>
<div class="status-bar" id="status-bar">Haetaan hintatietoja...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const CONTRACT = 7.79;
let allData = { today: [], tomorrow: [] };
let currentDay = 'today';
let chartInstance = null;
let swReg = null;

function pad(n) { return String(n).padStart(2, '0'); }

// ── SERVICE WORKER ─────────────────────────────────────────
async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    swReg = await navigator.serviceWorker.register('./sw.js');
    console.log('SW rekisteröity');
  } catch(e) {
    console.warn('SW rekisteröinti epäonnistui:', e);
  }
}

// ── NOTIFICATIONS ──────────────────────────────────────────
function updateNotifBtn() {
  const btn = document.getElementById('notif-btn');
  if (!('Notification' in window)) { btn.style.display = 'none'; return; }
  if (Notification.permission === 'granted') {
    btn.textContent = '🔔 Ilmoitukset päällä';
    btn.classList.add('on');
  } else {
    btn.textContent = '🔔 Ilmoitukset';
    btn.classList.remove('on');
  }
}

function toggleNotifications() {
  if (!('Notification' in window)) {
    alert('Selaimesi ei tue ilmoituksia. Avaa sovellus kotinäytöltä tai käytä Chromea.');
    return;
  }
  if (Notification.permission === 'granted') {
    alert('Ilmoitukset ovat päällä ✅\nSaat joka aamu klo 7 tiedon halvimmista tunneista.\n\nVoit poistaa ilmoitukset selaimen sivustoasetuksista.');
    return;
  }
  document.getElementById('notif-banner').style.display = 'block';
}

async function requestNotifPermission() {
  const result = await Notification.requestPermission();
  document.getElementById('notif-banner').style.display = 'none';
  updateNotifBtn();
  if (result === 'granted') {
    scheduleViaSW();
    // Test notification
    if (swReg) {
      swReg.showNotification('✅ Ilmoitukset aktivoitu!', {
        body: 'Saat jatkossa joka aamu klo 7 tiedon päivän halvimmista sähkötunneista.',
        icon: 'https://em-content.zobj.net/source/apple/354/high-voltage_26a1.png',
        tag: 'test'
      });
    }
  } else {
    alert('Ilmoituslupa evätty. Voit muuttaa tämän selaimen sivustoasetuksista.');
  }
}

function scheduleViaSW() {
  if (!swReg || !navigator.serviceWorker.controller) {
    // SW not yet controlling — retry after a moment
    setTimeout(scheduleViaSW, 1000);
    return;
  }
  // Tell SW to schedule alarm at 07:00
  navigator.serviceWorker.controller.postMessage({ type: 'SCHEDULE_ALARM', targetHour: 7, targetMinute: 0 });
  // Also schedule 14:30 for tomorrow's prices
  navigator.serviceWorker.controller.postMessage({ type: 'SCHEDULE_ALARM', targetHour: 14, targetMinute: 30 });
}

// ── DATA FETCHING ──────────────────────────────────────────
async function fetchPrices() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('status-bar').textContent = 'Haetaan hintatietoja...';
  try {
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    const tomorrowEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2, 0, 0, 0);
    const url = `https://sahkotin.fi/prices?fix&vat&start=${todayStart.toISOString()}&end=${tomorrowEnd.toISOString()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    const tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const tomorrowStr = `${tm.getFullYear()}-${pad(tm.getMonth()+1)}-${pad(tm.getDate())}`;

    const todayMap = {}, tomorrowMap = {};
    for (const p of data.prices) {
      const d = new Date(p.date);
      const localStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      const h = d.getHours();
      if (localStr === todayStr) todayMap[h] = { hour: h, price: p.value };
      else if (localStr === tomorrowStr) tomorrowMap[h] = { hour: h, price: p.value };
    }
    allData.today = Object.values(todayMap).sort((a, b) => a.hour - b.hour);
    allData.tomorrow = Object.values(tomorrowMap).sort((a, b) => a.hour - b.hour);
    if (allData.today.length === 0) throw new Error('Ei dataa');

    document.getElementById('tab-tomorrow').textContent =
      allData.tomorrow.length > 0 ? 'Huomenna' : 'Huomenna (—)';
    const time = now.toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('status-bar').textContent = 'Päivitetty ' + time;
    renderDay(currentDay);

    // Re-schedule if permission already granted
    if (Notification.permission === 'granted') scheduleViaSW();
  } catch(e) {
    const err = document.getElementById('error-msg');
    err.style.display = 'block';
    err.textContent = 'Hintatietojen haku epäonnistui (' + e.message + '). Tarkista verkkoyhteytesi.';
    document.getElementById('status-bar').textContent = '';
  } finally {
    btn.classList.remove('spinning');
  }
}

// ── RENDERING ──────────────────────────────────────────────
function renderDay(day) {
  const prices = allData[day];
  if (!prices || prices.length === 0) {
    document.getElementById('hour-list').innerHTML = '<div class="empty-state">Hintatietoja ei vielä saatavilla.</div>';
    document.getElementById('stat-avg').textContent = '—';
    document.getElementById('stat-min').textContent = '—';
    document.getElementById('stat-min-sub').textContent = '';
    renderChart([]);
    return;
  }
  const vals = prices.map(p => p.price);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const minVal = Math.min(...vals);
  const minEntry = prices.find(p => p.price === minVal);

  const avgEl = document.getElementById('stat-avg');
  avgEl.textContent = avg.toFixed(1);
  avgEl.className = 'stat-value' + (avg < CONTRACT ? ' green' : ' red');
  document.getElementById('stat-avg-sub').textContent = 'snt/kWh (vs 7,79)';
  document.getElementById('stat-min').textContent = pad(minEntry.hour) + ':00';
  document.getElementById('stat-min-sub').textContent = minVal.toFixed(1) + ' snt/kWh';

  renderChart(prices);

  const now = new Date();
  const curHour = now.getHours();
  let html = '';
  for (const p of prices) {
    const isCheap = p.price < CONTRACT;
    const isCurrent = day === 'today' && p.hour === curHour;
    const diff = p.price - CONTRACT;
    const diffStr = (diff >= 0 ? '+' : '') + diff.toFixed(1);
    const rowClass = (isCheap ? 'cheap' : 'expensive') + (isCurrent ? ' current' : '');
    const nowBadge = isCurrent ? '<span class="badge badge-now">Nyt</span>' : '';
    html += `<div class="hour-row ${rowClass}">
      <span class="hour-time">${pad(p.hour)}–${pad((p.hour+1)%24)}</span>
      <span class="hour-price ${isCheap?'green':'red'}">${p.price.toFixed(1)} snt</span>
      <span class="hour-diff ${diff>=0?'pos':'neg'}">${diffStr} snt</span>
      ${nowBadge}
    </div>`;
  }
  document.getElementById('hour-list').innerHTML = html;
  if (day === 'today') {
    setTimeout(() => {
      const row = document.querySelector('.hour-row.current');
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
  }
}

function renderChart(prices) {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  if (!prices.length) return;
  const bgColors = prices.map(p => p.price < CONTRACT ? '#4ade80' : '#f87171');
  chartInstance = new Chart(document.getElementById('priceChart'), {
    type: 'bar',
    data: {
      labels: prices.map(p => pad(p.hour)),
      datasets: [
        { data: prices.map(p => parseFloat(p.price.toFixed(2))), backgroundColor: bgColors, borderRadius: 3, borderSkipped: false, order: 1 },
        { type: 'line', data: prices.map(() => CONTRACT), borderColor: 'rgba(129,140,248,0.7)', borderWidth: 2, borderDash: [4, 3], pointRadius: 0, fill: false, order: 0 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#1e2130', titleColor: '#9ca3af', bodyColor: '#f0f0f0', borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1,
          callbacks: { label: ctx => ctx.datasetIndex === 0 ? ctx.parsed.y.toFixed(1) + ' snt/kWh' : 'Sopimushinta 7,79 snt' }
        }
      },
      scales: {
        x: { ticks: { color: '#4b5563', font: { size: 10, family: 'DM Mono' }, autoSkip: true, maxTicksLimit: 12 }, grid: { display: false }, border: { display: false } },
        y: { ticks: { color: '#4b5563', font: { size: 10, family: 'DM Mono' }, callback: v => v.toFixed(0) }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { display: false } }
      }
    }
  });
}

function showDay(day) {
  currentDay = day;
  document.getElementById('tab-today').classList.toggle('active', day === 'today');
  document.getElementById('tab-tomorrow').classList.toggle('active', day === 'tomorrow');
  renderDay(day);
}

// ── INIT ───────────────────────────────────────────────────
registerSW();
updateNotifBtn();
fetchPrices();
setInterval(fetchPrices, 10 * 60 * 1000);
</script>
</body>
</html>
